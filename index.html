<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="轻账：记录日常收支，查看每月结余。"><title>轻账 · 个人记账本</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%231d6555'/%3E%3Cpath d='M12 11h16v20H12zM16 17h8M16 22h8' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E"><link rel="stylesheet" href="styles.css"><script defer src="ledger.js"></script><script defer src="app.js"></script></head>
<body><header><a class="brand" href="./"><b>账</b>轻账<span>个人记账本</span></a><span class="storage">● 保存在此浏览器</span></header><main>
<section class="heading"><div><p>把日子，记清楚</p><h1>我的收支</h1></div><label class="month">查看月份<input id="month" type="month" required aria-label="查看月份"></label></section>
<section class="summary" aria-label="本月概览"><article class="balance"><span>本月结余</span><strong id="balance">¥0.00</strong><p>收入减去支出，生活心中有数。</p></article><article><span>● 本月收入</span><strong id="income">¥0.00</strong><p id="income-count">0 笔收入</p></article><article><span>● 本月支出</span><strong id="expense">¥0.00</strong><p id="expense-count">0 笔支出</p></article></section>
<div class="workspace"><aside class="panel"><div class="panel-title"><h2>记一笔</h2><span>＋</span></div><form id="entry-form">
<fieldset class="type-switch"><legend class="sr-only">收支类型</legend><label><input type="radio" name="type" value="expense" checked><span>支出</span></label><label><input type="radio" name="type" value="income"><span>收入</span></label></fieldset>
<label class="field">金额（元）<input id="amount" name="amount" inputmode="decimal" placeholder="0.00" required maxlength="13" autocomplete="off"><small>最多两位小数</small></label>
<div class="field-row"><label class="field">分类<select id="category" name="category"></select></label><label class="field">日期<input id="date" name="date" type="date" required></label></div>
<label class="field">备注 <small>选填</small><input id="note" name="note" placeholder="这笔钱花在哪里？" maxlength="80" autocomplete="off"></label><button class="primary" type="submit">保存账目 <span>↗</span></button><p id="feedback" role="status" aria-live="polite"></p></form><p class="local-note">账目仅保存在当前浏览器，不会上传到 GitHub。清除浏览器数据会删除账目。</p></aside>
<div class="details"><section class="panel"><div class="panel-title"><h2>支出去哪了</h2><span id="category-count" class="muted">本月分类</span></div><div id="breakdown"></div></section><section class="panel"><div class="panel-title"><h2>账目明细 <span id="record-count" class="count">0</span></h2><span class="muted">按日期排序</span></div><div id="records"></div></section></div></div><footer>认真记录每一笔，也好好过每一天。</footer></main>
<dialog id="delete-dialog"><h2>删除这笔账目？</h2><p>删除后无法恢复，本月统计也会随之更新。</p><div class="dialog-actions"><button id="cancel-delete" type="button">取消</button><button id="confirm-delete" class="danger" type="button">删除账目</button></div></dialog></body></html>
